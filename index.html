<!DOCTYPE html>

<head>

<style>
:root{color-scheme:dark;--bg:#09090d;--muted:#a5a5b3;--line:rgba(255,255,255,.11);--white:#f7f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--white);font-family:"DM Sans",sans-serif;background:var(--bg);overflow-x:hidden}
#bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:.68;pointer-events:none}
.video-shade{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,rgba(5,5,12,.40),rgba(5,5,12,.68) 55%,rgba(5,5,12,.88))}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}
.wrap{width:min(100% - 32px,510px);margin:auto;padding:58px 0 34px;position:relative}
.top{display:flex;justify-content:center;align-items:center;margin-bottom:35px}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:#c9c5d8;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.035);backdrop-filter:blur(12px)}
.profile{text-align:center;margin-bottom:31px}
.avatar{width:116px;height:116px;margin:0 auto 18px;border-radius:50%;display:block;object-fit:cover;object-position:center 38%;box-shadow:0 0 0 3px rgba(255,255,255,.78),0 0 0 8px rgba(167,139,250,.22),0 15px 55px rgba(124,92,255,.38);border:1px solid rgba(255,255,255,.3)}
h1{font:700 clamp(32px,8vw,43px)/1 "Space Grotesk";letter-spacing:-2.5px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:12px 0 0}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:17px;color:#c8f7e8;font-size:11px;letter-spacing:.5px;background:rgba(32,196,143,.09);border:1px solid rgba(32,196,143,.2);border-radius:99px;padding:7px 11px}
.dot{width:6px;height:6px;border-radius:50%;background:#42e0a7;box-shadow:0 0 10px #42e0a7}
.links{display:grid;gap:12px}
.link{--accent:#a78bfa;position:relative;display:flex;align-items:center;gap:15px;text-decoration:none;color:var(--white);padding:16px 17px;border-radius:19px;border:1px solid var(--line);background:linear-gradient(110deg,rgba(255,255,255,.075),rgba(255,255,255,.025));backdrop-filter:blur(16px);transition:transform .22s,border-color .22s,background .22s;overflow:hidden;animation:rise .65s both}
.link:nth-child(2){animation-delay:.08s}.link:nth-child(3){animation-delay:.16s}
.link:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:.9}
.link:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent),transparent 45%);background:linear-gradient(110deg,rgba(255,255,255,.11),rgba(255,255,255,.04))}
.icon{width:47px;height:47px;flex:0 0 47px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent),transparent 87%);color:var(--accent)}
.icon svg{width:23px;height:23px;fill:currentColor}
.copy{min-width:0;flex:1}
.name{font:600 16px "Space Grotesk";display:block}
.handle{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.arrow{color:#858594;font-size:21px;transition:transform .2s}
.link:hover .arrow{transform:translate(3px,-3px);color:#fff}
.note{text-align:center;color:#777786;font-size:11px;margin:27px 0 0;letter-spacing:.3px}
footer{text-align:center;color:#626270;font-size:11px;margin-top:42px;letter-spacing:1.5px}
footer span{color:#aaa5bd}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
